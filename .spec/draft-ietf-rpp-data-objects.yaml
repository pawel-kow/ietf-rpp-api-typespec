# RPP Data Objects — Structured Object Model
#
# Generated by check_iana_consistency.py --yaml-out <path>. Reflects the
# NORMATIVE object definitions in the draft body (Component Objects, Process
# Objects, and Resource/Data Objects) — not the IANA registry tables, which
# are a separate, derived source checked for consistency against this model
# by the same script's --check pass.
#
# Regenerate after editing the source draft; do not hand-edit this file.
#
# --- Top-level structure ---------------------------------------------------
#
# section_notes:
#   Free-form intro prose that precedes the first object in a normative H1
#   section and is not attached to any single object (e.g. the paragraph
#   directly under "# Process Objects" before the first "## ... Object"
#   heading). Keyed by the literal H1 heading text. Absent for sections with
#   no such intro (most Resource/Data Object sections start immediately with
#   the object's own header bullets, so they have no entry here).
#
# components / processes / resources:
#   One list per Object Type (Component, Process, Resource), each entry
#   built from the object's normative definition:
#
#     identifier:   camelCase machine-readable Identifier bullet
#     name:         human-readable Name bullet
#     object_type:  "Component" | "Process" | "Resource"
#     description:  the object's own "* Description:" bullet (may cite
#                   external references, e.g. "[@!RFC8543]")
#     preamble:     orphan prose found between the object's header bullets
#                   and its first element/operation — e.g. explanatory text
#                   that appears in the source but isn't itself a
#                   Name/Identifier/Description/Constraints attribute.
#                   Empty list if none.
#     elements:     every persisted data element, in document order
#     operations:   every operation (Resource/Process objects only), in
#                   document order
#     subsections:  non-Operations H3 subsections nested inside the object's
#                   own H2 (e.g. "### RDATA Structures in EPP Profile
#                   {#rdata-structures}" inside the dnsRecord Component
#                   Object) — content that belongs to the object but is
#                   neither a data element nor an operation. Empty list if
#                   the object has none. Each entry:
#                     heading: the subsection's heading text
#                     anchor:  its "{#...}" anchor, or "" if none
#                     notes:   its body, in document order — each prose
#                              paragraph and each top-level bullet becomes
#                              one list entry (bullets fold deeper nesting
#                              into that same entry, same as Constraints)
#
#   Each element entry:
#     identifier, name, cardinality, mutability, data_type: as defined in
#       the "Data Element Definitions" convention (CLAUDE.md)
#     description:  the element's "* Description:" bullet (a single string)
#     constraints:  the element's "* Constraints:" bullet as a LIST of
#                   strings, one per top-level constraint. A single inline
#                   value ("Constraints: MUST be positive.") becomes a
#                   one-item list; "(None)" (or nothing at all) becomes an
#                   empty list []. When the source instead has a blank
#                   "Constraints:" line followed by a nested bullet list
#                   (e.g. the Status Object's "label" element), each
#                   top-level nested bullet becomes one list entry, with any
#                   further nesting under it (a sub-list, a numbered list)
#                   folded into that same entry as extra newline-joined
#                   lines, keeping the original markers (e.g. "1.", "2.").
#     notes:        orphan prose inside the element's own block not captured
#                   by any of the fields above (e.g. a stray unstructured
#                   paragraph). Empty list if none.
#
#   Each operation entry:
#     identifier, name: as defined in the operation heading /
#       "* Identifier:" bullet
#     description:  plain prose describing the operation (this document's
#                   convention: NOT a "* Description:" bullet, which is
#                   element/object-only — every operation's description is
#                   prose written directly after its "* Identifier:" bullet).
#                   Covers every prose paragraph between "* Identifier:" and
#                   the first "* Authorisation:"/"* Input:"/"* Output:"
#                   bullet (or the transient-params marker), newline-joined
#                   if there is more than one paragraph.
#     authorisation: the operation's "* Authorisation:" bullet as a LIST of
#                   strings, one per top-level sub-bullet (same
#                   nested-bullet folding as an element's "constraints" —
#                   deeper nesting, e.g. "Pull transfer:"/"Push transfer:"
#                   sub-cases, is newline-joined into that entry). Empty
#                   list if the operation has no Authorisation bullet.
#     input:        the operation's "* Input:" bullet value (a single
#                   string, e.g. "Object identifier"). Empty string if absent.
#     output:       the operation's "* Output:" bullet value (a single
#                   string). Empty string if absent.
#     notes:        orphan prose in the operation's body beyond description/
#                   authorisation/input/output (e.g. a further explanatory
#                   paragraph after the Authorisation bullet, or the
#                   "the following transient data elements..." lead-in
#                   sentence). Empty list if none.
#     params:       transient (non-persisted) operation parameters, each
#                   with identifier, name, cardinality, data_type,
#                   description, constraints, notes — same meaning as for
#                   elements.
#
# Nothing here duplicates content already captured in a structured field:
# "notes"/"preamble"/"section_notes" contain ONLY the leftover prose the
# script could not attribute to a Name/Identifier/Cardinality/Mutability/
# Data Type/Description/Constraints bullet. Editorial aside notes ("A>"
# blocks, e.g. TODO/TBD/TBC markers) are intentionally excluded everywhere.
# -----------------------------------------------------------------------------


section_notes:
  '# Component Objects':
  - This section defines the Component Objects used in this document.
  '# Process Objects {#process-objects}':
  - This section defines the Process Objects used in this document.
  - 'Each Process Object carries an OPTIONAL Process ID data element, defined as follows:'
components:
- identifier: period
  name: Period Object
  object_type: Component
  description: Represents a duration of time.
  preamble: []
  elements:
  - identifier: value
    name: Value
    cardinality: '1'
    mutability: read-write
    data_type: Integer
    description: The numeric value of the period.
    constraints:
    - The value MUST be from 1 to 99, inclusive.
    notes: []
  - identifier: unit
    name: Unit
    cardinality: '1'
    mutability: read-write
    data_type: String
    description: The unit of the period.
    constraints:
    - 'The value MUST be one of: "y" (years) or "m" (months).'
    notes: []
  operations: []
  subsections: []
- identifier: provMetadata
  name: Provisioning Metadata Object
  object_type: Component
  description: Contains standard metadata about the lifecycle and ownership of a provisioned object. This
    metadata is common across all resource objects in the registry system.
  preamble: []
  elements:
  - identifier: repositoryId
    name: Repository ID
    cardinality: 0-1
    mutability: read-only
    data_type: Identifier
    description: A server-assigned unique identifier for the object.
    constraints:
    - In EPP Compatibility Profile this data element MUST be provided.
    notes: []
  - identifier: spClientId
    name: Sponsoring Client ID
    cardinality: '1'
    mutability: read-only
    data_type: Client Identifier
    description: The identifier of the client that is the current sponsor of the object.
    constraints: []
    notes: []
  - identifier: crClientId
    name: Creating Client ID
    cardinality: 0-1
    mutability: read-only
    data_type: Client Identifier
    description: The identifier of the client that created the object.
    constraints: []
    notes: []
  - identifier: crDate
    name: Creation Date
    cardinality: 0-1
    mutability: read-only
    data_type: Timestamp
    description: The date and time of object creation.
    constraints:
    - The value is set by the server and cannot be specified by the client.
    notes: []
  - identifier: upClientId
    name: Updating Client ID
    cardinality: 0-1
    mutability: read-only
    data_type: Client Identifier
    description: The identifier of the client that last updated the object.
    constraints:
    - This element MUST NOT be present if the object has never been modified.
    notes: []
  - identifier: upDate
    name: Update Date
    cardinality: 0-1
    mutability: read-only
    data_type: Timestamp
    description: The date and time of the most recent object modification.
    constraints:
    - This element MUST NOT be present if the object has never been modified.
    notes: []
  - identifier: trDate
    name: Transfer Date
    cardinality: 0-1
    mutability: read-only
    data_type: Timestamp
    description: The date and time of the most recent successful object transfer.
    constraints:
    - This element MUST NOT be provided if the object has never been transferred.
    notes: []
  operations: []
  subsections: []
- identifier: status
  name: Status Object
  object_type: Component
  description: Represents one of the status values associated with a provisioning object
  preamble: []
  elements:
  - identifier: label
    name: Label
    cardinality: '1'
    mutability: create-only
    data_type: String
    description: machine-readable enum label of a status
    constraints:
    - Exact list of allowed status labels depends on the provisioning object type. This enumeration can
      be expanded by extensions.
    - The status labels MUST use camel case notation and use only ASCII alphabetic characters.
    - 'Statuses MAY be of three categories:

      1. those explicitly set by a server. Those MUST have "server" prefix

      2. those explicitly set by a client. Those MUST have "client" prefix

      3. those indirectly controlled by provisioning object lifecycle or business logic. Those MUST NOT
      use either "client" or "server" prefix. They MAY use another prefix or no prefix at all'
    - 'The following additional status labels are defined for use with the Redemption Grace Period (RGP)
      feature. When the RGP feature is supported, these labels MAY be specified:

      * `addPeriod`: The object is within the add grace period following initial registration. If the
      object is deleted during this period, the registry MAY provide a credit to the sponsoring client.

      * `autoRenewPeriod`: The object is within the auto-renew grace period following automatic renewal
      by the registry. If the object is deleted during this period, the registry MAY provide a credit
      to the sponsoring client.

      * `renewPeriod`: The object is within the renew grace period following an explicit renewal. If the
      object is deleted during this period, the registry MAY provide a credit to the sponsoring client.

      * `transferPeriod`: The object is within the transfer grace period following a successful transfer.
      If the object is deleted by the new sponsoring client during this period, the registry MAY provide
      a credit.

      * `redemptionPeriod`: A delete operation has been received and processed for the object, but the
      object has not yet been purged. A restore operation MAY be requested to abort the deletion. This
      status value MUST only appear alongside the standard `pendingDelete` status.

      * `pendingRestore`: A restore request has been accepted and the registry is waiting for a restore
      report from the sponsoring client. This status value MUST only appear alongside the standard `pendingDelete`
      status.

      * `rgpPendingDelete`: The redemption period has elapsed without a successful restore. The object
      has entered the purge processing state. This status value MUST only appear alongside the standard
      `pendingDelete` status. This label is used to distinguish the RGP-specific pending-delete sub-state
      from the broader EPP `pendingDelete` status.'
    notes: []
  - identifier: reason
    name: Reason
    cardinality: 0-1
    mutability: create-only
    data_type: String
    description: a human-readable text that describes the rationale for the status applied to the object.
    constraints:
    - None
    notes: []
  - identifier: due
    name: Due
    cardinality: 0-1
    mutability: read-write
    data_type: Timestamp
    description: a timestamp, when this status is going to be removed automatically, or changed to other
      status. This field can be used to express lifecycle related information.
    constraints:
    - servers MAY restrict possibility to set or update this value by the client.
    notes: []
  operations: []
  subsections: []
- identifier: dnsRecord
  name: DNS Resource Record Object
  object_type: Component
  description: Represents a single DNS resource record. The structure follows the top-level format of
    a DNS resource record as described in Section 3.2.1 of [@!RFC1035], adapted for use in provisioning.
    The RDATA field is represented as a structured object whose fields depend on the record type, following
    the RDATA presentation format described by the corresponding RFC defining the record type. This approach
    is aligned with [@I-D.simmen-rpp-dns-data].
  preamble: []
  elements:
  - identifier: name
    name: Name
    cardinality: '1'
    mutability: read-write
    data_type: String
    description: The owner name of the DNS entry. This MAY be the domain itself or a subordinate host
      name.
    constraints:
    - The value MUST be a syntactically valid DNS host name.
    - Absolute FQDNs (with trailing dot) and relative host names are allowed, as well as the "@" symbol
      representing the domain name itself.
    notes: []
  - identifier: class
    name: Class
    cardinality: 0-1
    mutability: read-write
    data_type: String
    description: The DNS resource record class.
    constraints:
    - If present, the value MUST be chosen from Section 3.2.4 (CLASS values) of [@!RFC1035].
    - A client SHOULD omit this element. The server MUST assume "IN" as the default class and MAY decline
      other values.
    notes: []
  - identifier: type
    name: Type
    cardinality: '1'
    mutability: read-write
    data_type: String
    description: The DNS resource record type, indicating the format of the RDATA field.
    constraints:
    - The value MUST be a valid string representation of a resource record type as defined in [@!RFC1035]
      or other RFC describing the record type.
    - Allowed values MAY be constrained by server policies. For domain provisioning, the type would typically
      be constrained to the allowed parent-side entries.
    - Values MUST be converted to lower case.
    - 'In EPP Compatibility Profile ([@!RFC5732]), the following record types MUST be supported: `ns`,
      `a`, and `aaaa`.'
    - 'In EPP Compatibility Profile with DNSSEC Extension [@RFC5910], the following record types MUST
      additionally be supported: `ds` and `dnskey`.'
    notes: []
  - identifier: rdata
    name: RDATA
    cardinality: '1'
    mutability: read-write
    data_type: Object
    description: The actual payload data of the DNS record. The structure of this object depends on the
      record type and MUST follow the RDATA presentation format described by the corresponding RFC. Property
      names MUST be written in camelCase. All property values MUST be represented as Strings encoding
      the presentation format of the value.
    constraints:
    - The fields within RDATA MUST match the expected structure for the given record type.
    - See (#rdata-structures) for required structures in the EPP Compatibility Profile.
    notes:
    - This section defines the RDATA field structures required for interoperability in the EPP Compatibility
      Profile.
    - 'In EPP Compatibility Profile ([@!RFC5732]), the following RDATA structures MUST be supported:'
  operations: []
  subsections:
  - heading: RDATA Structures in EPP Profile
    anchor: '{#rdata-structures}'
    notes:
    - This section defines the RDATA field structures required for interoperability in the EPP Compatibility
      Profile.
    - 'In EPP Compatibility Profile ([@!RFC5732]), the following RDATA structures MUST be supported:'
    - 'For NS records ([@!RFC1035], Section 3.3.11): `nsdname` (the fully qualified domain name of the
      name server).'
    - 'For A records ([@!RFC1035], Section 3.4.1): `address` (the IPv4 address in dotted-decimal notation).'
    - 'For AAAA records ([@RFC3596], Section 2.2): `address` (the IPv6 address in text representation
      as defined in [@!RFC5952]).'
    - 'In EPP Compatibility Profile with DNSSEC Extension ([@RFC5910]), the following RDATA structures
      MUST additionally be supported:'
    - 'For DS records ([@RFC4034], Section 5): `keyTag` (key tag value), `algorithm` (algorithm number),
      `digestType` (digest algorithm type), and `digest` (digest value).'
    - 'For DNSKEY records ([@RFC4034], Section 2): `flags` (flags field value), `protocol` (protocol field
      value), `algorithm` (algorithm number), and `publicKey` (encoded public key value).'
- identifier: dnsControls
  name: DNS Operational Controls Object
  object_type: Component
  description: Contains operational control parameters that a client MAY use to influence server-side
    DNS behaviour for a set of DNS records. A server MAY ignore these values, e.g. for policy reasons.
    This structure is aligned with [@I-D.simmen-rpp-dns-data].
  preamble: []
  elements:
  - identifier: ttl
    name: TTL
    cardinality: 0-1
    mutability: read-write
    data_type: Dictionary[Integer]
    description: Controls the caching behaviour of DNS resource records. The dictionary is keyed by lower-case
      record type name, with values representing the TTL in seconds for that record type.
    constraints:
    - The keys MUST be valid DNS resource record type names in lower case.
    - The values MUST be positive Integers.
    - The allowed value ranges MAY be constrained by server policy.
    - A server MAY ignore client-specified TTL values and apply default or policy-defined values.
    notes: []
  - identifier: maxSigLifetime
    name: Maximum Signature Lifetime
    cardinality: 0-1
    mutability: read-write
    data_type: Dictionary[Integer]
    description: Specifies a child's preference for the maximum number of seconds after signature generation
      when the parent's signature on signed DNS information should expire. The dictionary is keyed by
      lower-case record type name, with values representing the maximum signature lifetime in seconds
      for that record type. The value applies to the RRSIG resource record over the signed DNS RRset.
      See Section 3 of [@RFC4034] for information on the RRSIG resource record. This corresponds to the
      maxSigLife concept from [@RFC5910].
    constraints:
    - The keys MUST be valid DNS resource record type names in lower case.
    - The values MUST be positive Integers (minimum value of 1).
    - A server MAY ignore client-specified values and apply its own default signature expiration policy.
    notes: []
  operations: []
  subsections: []
- identifier: dnsData
  name: DNS Data Object
  object_type: Component
  description: A container for DNS resource records and associated operational controls for a provisioned
    object. This structure groups DNS records together with control parameters that influence server-side
    DNS behaviour. The structure is aligned with [@I-D.simmen-rpp-dns-data].
  preamble: []
  elements:
  - identifier: records
    name: Records
    cardinality: 0+
    mutability: read-write
    data_type: Composition[DNS Resource Record Object]
    description: An array of DNS resource records associated with the provisioned object.
    constraints:
    - Allowed record types MAY be constrained by server policy.
    - In EPP Compatibility Profile with DNSSEC Extension [@RFC5910], records of type DS and DNSKEY MUST
      be supported in addition to NS, A, and AAAA.
    - A server MUST support either DS or DNSKEY or both record types for DNSSEC provisioning. If provided
      with only DNSKEY, a server MUST calculate the DS record. If both record types are provided, a server
      MAY use the DNSKEY to validate the DS record.
    notes: []
  - identifier: controls
    name: Controls
    cardinality: 0-1
    mutability: read-write
    data_type: DNS Operational Controls Object
    description: Operational control parameters for the DNS records.
    constraints: []
    notes: []
  operations: []
  subsections: []
- identifier: authInfo
  name: Authorisation Information
  object_type: Component
  description: Contains information used to authorise operations on a data object. It may hold different
    kinds of authorisation information.
  preamble: []
  elements:
  - identifier: method
    name: Method
    cardinality: '1'
    mutability: create-only
    data_type: String
    description: The identifier of the RPP authorisation method.
    constraints:
    - The value MUST be one of the values registered at IANA as defined in [I-D.draft-wullink-rpp-core].
    - In EPP Compatibility Profile this value MUST be set to `authinfo` if standard password-based authorisation
      is used
    notes: []
  - identifier: authdata
    name: Authorisation Information
    cardinality: '1'
    mutability: create-only
    data_type: String
    description: The value of the authorisation information. It might be as simple as a password string,
      but also more complex values like public key certificates or tokens encoded as string are possible.
    constraints:
    - Authorisation Information object is immutable. If the information changes (for example password
      is updated) a new instance MUST be created.
    - Depending on the method and server policy Authorisation Information MAY not be available for read
      or any other operation responding with this data element.
    notes: []
  operations: []
  subsections: []
- identifier: disclose
  name: Disclose
  object_type: Component
  description: TBD
  preamble: []
  elements: []
  operations: []
  subsections: []
- identifier: restoreReport
  name: Restore Report Object
  object_type: Component
  description: Contains the redemption grace period restore report submitted by the sponsoring client
    as required by the RGP process ([@!RFC3915]). A restore report documents the state of the object before
    and after deletion, provides the reason for restoration, and includes mandatory client statements.
    This object is OPTIONAL and is only required when the RGP feature is supported and a restore report
    is being submitted.
  preamble: []
  elements:
  - identifier: preData
    name: Pre-Delete Data
    cardinality: 0-1
    mutability: read-write
    data_type: String
    description: A copy of the registration data that existed for the object prior to the object being
      deleted.
    constraints:
    - None.
    notes: []
  - identifier: postData
    name: Post-Restore Data
    cardinality: 0-1
    mutability: read-write
    data_type: String
    description: A copy of the registration data that exists for the object at the time the restore report
      is submitted.
    constraints:
    - None.
    notes: []
  - identifier: deleteTime
    name: Delete Time
    cardinality: 0-1
    mutability: read-write
    data_type: Timestamp
    description: The date and time when the object delete request was sent to the server.
    constraints:
    - None.
    notes: []
  - identifier: restoreTime
    name: Restore Time
    cardinality: 0-1
    mutability: read-write
    data_type: Timestamp
    description: The date and time when the original restore request operation was sent to the server.
    constraints:
    - This element MAY be omitted when the restore report is submitted inline within the restore request
      in a single-step process.
    - In EPP Compatibility Profile this element MUST be present as defined in [@!RFC3915].
    notes: []
  - identifier: restoreReason
    name: Restore Reason
    cardinality: 0-1
    mutability: read-write
    data_type: String
    description: A brief explanation of the reason for restoring the object.
    constraints:
    - None.
    notes: []
  - identifier: statements
    name: Statements
    cardinality: 0+
    mutability: read-write
    data_type: String
    description: Client statements required by the RGP process.
    constraints:
    - At least one and at most two statements MUST be provided. In EPP Compatibility Profile exactly two
      statements MUST be present as defined in [@!RFC3915].
    notes: []
  - identifier: other
    name: Other
    cardinality: 0-1
    mutability: read-write
    data_type: String
    description: Any additional information needed to support the statements provided by the client.
    constraints:
    - None.
    notes: []
  operations: []
  subsections: []
- identifier: organisationRole
  name: Organisation Role Object
  object_type: Component
  description: Represents a role that an organisation has within the registry ecosystem, as defined in
    [@!RFC8543, section 3.2]. An organisation object MUST always have at least one associated role. A
    single organisation MAY have multiple roles with different role types.
  preamble: []
  elements:
  - identifier: status
    name: Role Status
    cardinality: 0+
    mutability: read-write
    data_type: String
    description: The status of this particular role. A role SHOULD have at least one associated status
      value.
    constraints:
    - 'Allowed values: `ok`, `linked`, `clientLinkProhibited`, `serverLinkProhibited`.'
    - '`ok` is the normal status value for a role with no active prohibitions.'
    - '`linked` indicates the role has at least one active association with another object. This value
      is not explicitly set by the client.'
    - '`clientLinkProhibited` and `serverLinkProhibited` indicate that requests to add new links to the
      role MUST be rejected.'
    notes: []
  - identifier: roleId
    name: Role Identifier
    cardinality: 0-1
    mutability: read-write
    data_type: String
    description: A third-party-assigned identifier for the role, such as an IANA ID for registrars.
    constraints: []
    notes: []
  operations: []
  subsections: []
- identifier: processes
  name: Processes Object
  object_type: Component
  description: A container grouping the Process Objects (#process-objects) currently or recently initiated
    on a Data Object. Each data element MUST be named after the identifier of a Process Object and MUST
    be of type Aggregation of that Process Object. The data elements below are the process types defined
    in this document.
  preamble: []
  elements:
  - identifier: transferProcess
    name: Transfer Processes
    cardinality: 0+
    mutability: read-only
    data_type: Aggregation[Transfer Process Object]
    description: The transfer processes initiated on the owning Data Object.
    constraints: []
    notes: []
  - identifier: renewProcess
    name: Renew Processes
    cardinality: 0+
    mutability: read-only
    data_type: Aggregation[Renew Process Object]
    description: The renew processes initiated on the owning Data Object.
    constraints: []
    notes: []
  - identifier: restoreProcess
    name: Restore Processes
    cardinality: 0+
    mutability: read-only
    data_type: Aggregation[Restore Process Object]
    description: The restore processes initiated on the owning Data Object.
    constraints: []
    notes: []
  - identifier: createProcess
    name: Create Processes
    cardinality: 0+
    mutability: read-only
    data_type: Aggregation[Create Process Object]
    description: The create processes initiated on the owning Data Object.
    constraints: []
    notes: []
  operations: []
  subsections: []
processes:
- identifier: transferProcess
  name: Transfer Process Object
  object_type: Process
  description: ''
  preamble: []
  elements:
  - identifier: processId
    name: Process ID
    cardinality: 0-1
    mutability: read-only
    data_type: String
    description: A server-assigned identifier of the process instance, unique within the scope of the
      Owner Data Object.
    constraints:
    - The value is set by the server and cannot be specified by the client.
    notes: []
  - identifier: transferDir
    name: Transfer Direction
    cardinality: 0-1
    mutability: create-only
    data_type: String
    description: Indicates whether the transfer is a "pull" or "push" transfer. Per policy, servers usually
      support only one model. If omitted, server policy determines the default.
    constraints:
    - 'The value MUST be one of: "pull" (initiated by the gaining client) or "push" (initiated by the
      sponsoring client).'
    notes: []
  - identifier: gainingClientId
    name: Gaining Client ID
    cardinality: 0-1
    mutability: create-only
    data_type: Client Identifier
    description: The identifier of the designated gaining client. This element is REQUIRED for push transfers
      and MUST NOT be provided for pull transfers.
    constraints: []
    notes: []
  - identifier: trStatus
    name: Transfer Status
    cardinality: '1'
    mutability: read-only
    data_type: String
    description: The state of the transfer request.
    constraints:
    - 'The value MUST be one of: "pending", "clientApproved", "clientCancelled", "clientRejected", "serverApproved",
      "serverCancelled".'
    notes: []
  - identifier: reqClientId
    name: Requesting Client ID
    cardinality: '1'
    mutability: read-only
    data_type: Client Identifier
    description: The identifier of the client that initiated the transfer request.
    constraints: []
    notes: []
  - identifier: requestDate
    name: Request Date
    cardinality: '1'
    mutability: read-only
    data_type: Timestamp
    description: The date and time that the transfer was requested.
    constraints: []
    notes: []
  - identifier: actClientId
    name: Acting Client ID
    cardinality: '1'
    mutability: read-only
    data_type: Client Identifier
    description: For a pending pull transfer, the identifier of the sponsoring client that SHOULD act
      upon the request. For a pending push transfer, the identifier of the designated gaining client that
      SHOULD act upon the request. For all other statuses, the identifier of the client that took the
      indicated action.
    constraints: []
    notes: []
  - identifier: actionDate
    name: Action Date
    cardinality: '1'
    mutability: read-only
    data_type: Timestamp
    description: For a pending request, the date and time by which a response is required before an automated
      response action SHOULD be taken by the server. For all other statuses, the date and time when the
      request was completed.
    constraints: []
    notes: []
  operations:
  - identifier: transferCreate
    name: Create (Transfer Request)
    description: The Create operation initiates a transfer by creating a Transfer Process Object associated
      with the provisioned object. The transfer direction and gaining client (for push transfers) are
      provided as `create-only` data elements of the Transfer Process Object.
    authorisation:
    - 'Pull transfer:

      * The requesting client (gaining client) MUST provide valid Object Authorisation.'
    - 'Push transfer:

      * Only the sponsoring client is authorised to initiate a push transfer.'
    input: ''
    output: ''
    notes: []
    params: []
  - identifier: transferRead
    name: Read (Transfer Query)
    description: The Read operation allows a client to determine the real-time status of a pending or
      recently completed transfer request.
    authorisation:
    - This operation MUST be accessible to both the sponsoring client and the gaining client.
    - Server policy determines whether other clients may query transfer status and what information is
      returned.
    input: None
    output: Transfer Process Object
    notes: []
    params: []
  - identifier: transferDelete
    name: Delete (Transfer Cancel)
    description: The Delete operation allows the initiating client to cancel its own pending transfer
      request.
    authorisation:
    - Only the initiating client (the client that originally requested the transfer).
    input: None
    output: Transfer Process Object or nothing
    notes: []
    params: []
  - identifier: transferApprove
    name: Approve
    description: The Approve operation allows the appropriate client to accept a pending transfer request.
    authorisation:
    - 'Pull transfer:

      * only the sponsoring client'
    - 'Push transfer:

      * only the designated gaining client'
    input: None
    output: Transfer Process Object
    notes: []
    params: []
  - identifier: transferReject
    name: Reject
    description: The Reject operation allows the appropriate client to decline a pending transfer request.
    authorisation:
    - 'Pull transfer:

      * only the sponsoring client'
    - 'Push transfer:

      * only the designated gaining client'
    input: ''
    output: ''
    notes:
    - 'The following transient data elements are defined for this operation:'
    params:
    - identifier: reason
      name: Reason
      cardinality: 0-1
      data_type: String
      description: A human-readable text describing the rationale for rejecting the transfer request.
      constraints:
      - In EPP Compatibility Profile this data element MUST NOT be used
      notes: []
  subsections: []
- identifier: restoreProcess
  name: Restore Process Object
  object_type: Process
  description: ''
  preamble: []
  elements:
  - identifier: processId
    name: Process ID
    cardinality: 0-1
    mutability: read-only
    data_type: String
    description: A server-assigned identifier of the process instance, unique within the scope of the
      Owner Data Object.
    constraints:
    - The value is set by the server and cannot be specified by the client.
    notes: []
  - identifier: restoreStatus
    name: Restore Status
    cardinality: '1'
    mutability: read-only
    data_type: String
    description: The current state of the restore process.
    constraints:
    - 'The value MUST be one of: `"pendingRestore"`, `"restored"`, `"rgpPendingDelete"`'
    notes: []
  - identifier: requestDate
    name: Request Date
    cardinality: 0-1
    mutability: read-only
    data_type: Timestamp
    description: The date and time when the restore request was submitted.
    constraints:
    - MUST NOT be present if no restore request has been submitted yet.
    notes: []
  - identifier: reportDate
    name: Report Date
    cardinality: 0-1
    mutability: read-only
    data_type: Timestamp
    description: The date and time when the most recent restore report was accepted by the server.
    constraints:
    - MUST NOT be present if no restore report has been accepted yet.
    notes: []
  - identifier: reportDueDate
    name: Report Due Date
    cardinality: 0-1
    mutability: read-only
    data_type: Timestamp
    description: The date and time by which a restore report must be submitted before the object reverts
      to `redemptionPeriod` state. Only present when the object is in `pendingRestore` state.
    constraints:
    - MUST NOT be present when `restoreStatus` is not `"pendingRestore"`.
    notes: []
  operations:
  - identifier: create
    name: Create (Restore Request)
    description: The Create operation initiates the recovery of an object in the `redemptionPeriod` state
      by creating a Restore Process Object. The server MUST reject this operation if the owning object
      is not in the `redemptionPeriod` state.
    authorisation:
    - Only the sponsoring client is authorised to perform this operation.
    input: Restore Process Object (create-only and read-write elements)
    output: Restore Process Object
    notes:
    - 'The following transient data elements are defined for this operation:'
    params:
    - identifier: restoreReport
      name: Restore Report
      cardinality: 0-1
      data_type: Restore Report Object
      description: An OPTIONAL inline restore report. If provided, the server processes the request and
        the report atomically. If the server does not require a restore report, this element MUST NOT
        be present and the restore is completed immediately. If the server requires a report and this
        element is absent, the object transitions to `pendingRestore` state awaiting a subsequent Report
        operation.
      constraints:
      - MUST NOT be provided if the server does not require a restore report.
      - In EPP Compatibility Profile, corresponds to `op="request"` (without report) or a combined `op="request"`
        followed immediately by `op="report"` as defined in [@!RFC3915].
      notes: []
  - identifier: read
    name: Read (Restore Query)
    description: The Read operation allows the sponsoring client to retrieve the current state of the
      RGP process for an object.
    authorisation:
    - Only the sponsoring client is authorised to perform this operation.
    input: Object Identifier
    output: Restore Process Object
    notes:
    - In EPP Compatibility Profile this operation is not supported.
    params: []
  - identifier: report
    name: Report
    description: 'This operation is OPTIONAL, only for servers which support or require submission of
      a restore report.

      The Report operation submits the restore report required by the RGP process for an object in the
      `pendingRestore` state. A report MAY be submitted more than once if corrections are required. The
      server MUST reject this operation if the object is not in the `pendingRestore` state.'
    authorisation:
    - Only the sponsoring client is authorised to perform this operation.
    input: Object Identifier, Restore Report Object
    output: Restore Process Object
    notes:
    - 'The following transient data elements are defined for this operation:'
    params:
    - identifier: restoreReport
      name: Restore Report
      cardinality: '1'
      data_type: Restore Report Object
      description: The restore report to be submitted as part of the RGP process.
      constraints:
      - In EPP Compatibility Profile, corresponds to `op="report"` as defined in [@!RFC3915].
      notes: []
  subsections: []
- identifier: renewProcess
  name: Renew Process Object
  object_type: Process
  description: ''
  preamble: []
  elements:
  - identifier: processId
    name: Process ID
    cardinality: 0-1
    mutability: read-only
    data_type: String
    description: A server-assigned identifier of the process instance, unique within the scope of the
      Owner Data Object.
    constraints:
    - The value is set by the server and cannot be specified by the client.
    notes: []
  - identifier: expiryDate
    name: Expiry Date
    cardinality: 0-1
    mutability: create-only
    data_type: Timestamp
    description: The current expiry date of the object. The server MUST validate this against the object's
      current `expiryDate` to prevent unintended duplicate renewals.
    constraints: []
    notes: []
  - identifier: renewalPeriod
    name: Renewal Period
    cardinality: 0-1
    mutability: create-only
    data_type: Period Object
    description: The duration to be added to the object's registration period. This value is used by the
      server to calculate the new `expiryDate`. The default value MAY be defined by server policy. The
      number of units available MAY be subject to limits imposed by the server.
    constraints: []
    notes: []
  operations:
  - identifier: renewCreate
    name: Create (Renew Request)
    description: The renew operation extends the validity period of an existing object by creating a Renew
      Process Object.
    authorisation: []
    input: ''
    output: ''
    notes: []
    params: []
  subsections: []
- identifier: createProcess
  name: Create Process Object
  object_type: Process
  description: ''
  preamble: []
  elements:
  - identifier: processId
    name: Process ID
    cardinality: 0-1
    mutability: read-only
    data_type: String
    description: A server-assigned identifier of the process instance, unique within the scope of the
      Owner Data Object.
    constraints:
    - The value is set by the server and cannot be specified by the client.
    notes:
    - Beyond the Process ID, the generic Create Process Object defines no additional data elements. Individual
      object definitions extend it with object-specific creation inputs (such as the Domain Create Process
      Object (#domain-create-process), which adds the registration period).
  operations:
  - identifier: create
    name: Create
    description: The Create operation is invoked implicitly as a side effect of the resource object create
      operation and is never invoked directly. It carries the creation-specific inputs consumed during
      the creation of the owning resource object.
    authorisation:
    - Inherited from the resource object create operation that initiates this process.
    input: Create Process Object (create-only and read-write elements)
    output: Create Process Object
    notes: []
    params: []
  - identifier: read
    name: Read
    description: The Read operation retrieves the result or status of the creation, if the server exposes
      the process resource.
    authorisation:
    - Only the sponsoring client is authorised to perform this operation.
    input: Object Identifier
    output: Create Process Object
    notes: []
    params: []
  subsections: []
- identifier: domainCreateProcess
  name: Domain Create Process Object
  object_type: Process
  description: ''
  preamble: []
  elements:
  - identifier: processId
    name: Process ID
    cardinality: 0-1
    mutability: read-only
    data_type: String
    description: A server-assigned identifier of the process instance, unique within the scope of the
      Owner Data Object.
    constraints:
    - The value is set by the server and cannot be specified by the client.
    notes: []
  - identifier: period
    name: Period
    cardinality: 0-1
    mutability: create-only
    data_type: Period Object
    description: The initial registration period for the domain name. This value is used by the server
      to calculate the initial `expiryDate` of the object.
    constraints: []
    notes: []
  operations:
  - identifier: create
    name: Create
    description: The Create operation is invoked implicitly as a side effect of the Domain Name Data Object
      create operation and is never invoked directly. It carries the registration period consumed during
      domain creation.
    authorisation:
    - Inherited from the Domain Name Data Object create operation that initiates this process.
    input: Domain Create Process Object (create-only and read-write elements)
    output: Domain Create Process Object
    notes: []
    params: []
  - identifier: read
    name: Read
    description: The Read operation retrieves the result or status of the domain creation, if the server
      exposes the process resource.
    authorisation:
    - Only the sponsoring client is authorised to perform this operation.
    input: Object Identifier
    output: Domain Create Process Object
    notes: []
    params: []
  subsections: []
resources:
- identifier: domainName
  name: Domain Name Data Object
  object_type: Resource
  description: ''
  preamble:
  - The following data elements are defined for the Domain Name Data Object.
  elements:
  - identifier: name
    name: Name
    cardinality: '1'
    mutability: create-only
    data_type: String
    description: The fully qualified name of the domain object.
    constraints:
    - The value MUST be a fully qualified domain name that conforms to the syntax described in [@!RFC1035].
    - A server MAY restrict allowable domain names to a particular top-level domain, second-level domain,
      or other domain for which the server is authoritative.
    - The trailing dot required when these names are stored in a DNS zone is implicit and MUST NOT be
      provided when exchanging host and domain names.
    notes: []
  - identifier: provMetadata
    name: Provisioning Metadata
    cardinality: '1'
    mutability: read-only
    data_type: Provisioning Metadata Object
    description: Standard metadata about the object's lifecycle and ownership.
    constraints: []
    notes: []
  - identifier: status
    name: Status
    cardinality: 0+
    mutability: read-only
    data_type: Status Object
    description: The current status descriptors associated with the domain.
    constraints:
    - Possible combinations of Status Object Labels are specified in [@!RFC5731, section 2.3].
    notes: []
  - identifier: registrant
    name: Registrant
    cardinality: 0-1
    mutability: read-write
    data_type: Contact Object
    description: The contact object associated with the domain as the registrant.
    constraints:
    - The relation MUST correspond to a valid Contact Data Object known to the server.
    - Servers MAY restrict association of a Contact Object of a different sponsoring client.
    notes: []
  - identifier: contacts
    name: Contacts
    cardinality: 0+
    mutability: read-write
    data_type: LabelledAggregation[Contact Object]
    description: A collection of other contact objects associated with the domain object.
    constraints:
    - Maximum number of associated contacts (per role) MAY be restricted by server policy
    notes: []
  - identifier: nameservers
    name: Nameservers
    cardinality: 0+
    mutability: read-write
    data_type: Aggregation[Host Data Object]
    description: A collection of nameservers associated with the domain.
    constraints: []
    notes: []
  - identifier: dns
    name: DNS Data
    cardinality: 0-1
    mutability: read-write
    data_type: DNS Data Object
    description: DNS resource records and operational controls related to the domain name. This structure
      follows the unified DNS data model defined in [@I-D.simmen-rpp-dns-data], providing a single container
      for all DNS-related provisioning data including delegation, DNSSEC, and other record types.
    constraints:
    - The type of the record entries MAY be constrained by the server policy. Typically the values would
      be limited to allowed parent-side resource record types.
    - In EPP Compatibility Profile, a server MUST support NS, A, and AAAA record types for delegation,
      and with DNSSEC Extension [@RFC5910] a server MUST additionally support DS and/or DNSKEY record
      types.
    - The names of DNS entries MUST be the domain name itself or subordinate to the domain name and MUST
      NOT be below zone cut in case of present delegation.
    - A server MAY forbid use of NS/A/AAAA record types if the server only supports host object model
      through Nameserver property defining those records.
    notes: []
  - identifier: subordinateHosts
    name: Subordinate Hosts
    cardinality: 0+
    mutability: read-only
    data_type: Aggregation[Host Data Object]
    description: A collection of subordinate host objects that exist under this domain.
    constraints: []
    notes: []
  - identifier: expiryDate
    name: Expiry Date
    cardinality: 0-1
    mutability: read-only
    data_type: Timestamp
    description: The date and time identifying the end of the domain object's registration period.
    constraints:
    - The value is set by the server and cannot be specified by the client.
    notes: []
  - identifier: authInfo
    name: Authorisation Information
    cardinality: 0-1
    mutability: read-write
    data_type: Authorisation Information Object
    description: Authorisation information associated with the domain object.
    constraints: []
    notes: []
  - identifier: processes
    name: Processes
    cardinality: 0-1
    mutability: read-only
    data_type: Processes Object
    description: The Process Objects currently or recently initiated on the domain object.
    constraints: []
    notes: []
  operations:
  - identifier: create
    name: Create Operation
    description: The Create operation allows a client to provision a new Domain Name resource. The operation
      accepts as input all create-only and read-write data elements defined for the Domain Name Data Object.
    authorisation:
    - Generally each client is authorised to create new domain objects becoming a sponsoring client. This
      can be however constrained by the server policy in many ways, i.e. by applying rate limiting, billing
      related constraints or compliance locks.
    input: ''
    output: ''
    notes:
    - The Create operation implicitly initiates the Domain Create Process Object (#domain-create-process),
      which carries the creation-specific inputs that are consumed during creation and not persisted as
      part of the domain object's state.
    params: []
  - identifier: read
    name: Read Operation
    description: The Read operation allows a client to retrieve the data elements of a Domain Name resource.
      The server's response MAY vary depending on client authorisation and server policy.
    authorisation:
    - 'Sponsoring client:

      * Full object'
    - 'Other client:

      * Without Object Authorisation:

      * Limited object (non-confidential properties) or operation denied

      * With Object Authorisation:

      * Full object, however some properties only authorised to the sponsoring client MAY be redacted
      according to server policy'
    input: ''
    output: ''
    notes:
    - 'The following transient data elements are defined for this operation:'
    params:
    - identifier: hostsFilter
      name: Hosts Filter
      cardinality: 0-1
      data_type: String
      description: Controls which host information is returned with
      constraints: []
      notes:
      - the object.
      - (delegated), "sub" (subordinate), or "none". The default value is "all".
  - identifier: update
    name: Update Operation
    description: The Update operation allows a client to modify the read-write data elements of an existing
      Domain Name resource.
    authorisation:
    - Only sponsoring client is authorised to perform this operation
    input: ''
    output: ''
    notes:
    - 'The following transient data elements are defined for this operation:'
    params:
    - identifier: urgent
      name: Urgent
      cardinality: 0-1
      data_type: Boolean
      description: Requests that the server operator process and implement the update with high priority.
        "High priority" is relative to standard server operator policies determined using an out-of-band
        mechanism. In EPP Compatibility Profile this corresponds to the "urgent" attribute of the `<secDNS:update>`
        element defined in [@RFC5910]. The default value is `false`.
      constraints:
      - A server that does not support this parameter MUST return an error if it is set to `true`.
      - A server that supports this parameter but cannot fulfil a specific urgent request MUST return
        an error.
      notes: []
  - identifier: delete
    name: Delete Operation
    description: The Delete operation allows a client to remove an existing Domain Name resource. The
      operation targets a specific data object identified by its name.
    authorisation:
    - Only sponsoring client is authorised to perform this operation
    input: ''
    output: ''
    notes:
    - The server SHOULD reject a delete request if subordinate host objects are associated with the domain
      name.
    - The error response SHOULD indicate the related subordinate host objects.
    params: []
  - identifier: renewCreate
    name: Renew Create Operation
    description: The Renew operation allows a client to extend the validity period of an existing Domain
      Name resource. The operation targets a specific data object identified by its name.
    authorisation:
    - Only sponsoring client is authorised to perform this operation
    input: ''
    output: ''
    notes: []
    params: []
  - identifier: transferCreate
    name: Transfer Create Operation
    description: ''
    authorisation: []
    input: ''
    output: ''
    notes:
    - 'In addition, the following transient data element is defined for this operation:'
    params:
    - identifier: transferPeriod
      name: Transfer Period
      cardinality: 0-1
      data_type: Period Object
      description: The number of units to be added to the registration period of the domain object upon
        successful completion of the transfer. The number of units available MAY be subject to limits
        imposed by the server.
      constraints: []
      notes: []
  subsections: []
- identifier: contact
  name: Contact Data Object
  object_type: Resource
  description: ''
  preamble:
  - The following data elements are defined for the Contact Data Object.
  elements:
  - identifier: id
    name: Handle ID
    cardinality: '1'
    mutability: create-only
    data_type: Identifier.
    description: External unique identifier of the contact object.
    constraints:
    - This value MUST be supported to be provided by the client.
    - Servers MAY support server-side generation of this value.
    notes: []
  - identifier: provMetadata
    name: Provisioning Metadata
    cardinality: '1'
    mutability: read-only
    data_type: Provisioning Metadata Object
    description: Standard metadata about the object's lifecycle and ownership.
    constraints: []
    notes: []
  - identifier: status
    name: Status
    cardinality: 0+
    mutability: read-only
    data_type: Status Object
    description: Status descriptors associated with the contact.
    constraints:
    - Possible combinations of Contact Status Labels are specified in [@!RFC5733, section 2.2]
    - The value MUST be one of the status tokens defined in the IANA registry for contact statuses.
    - The initial value list MAY be as defined in [@!RFC5733]. In this case the values MUST have the same
      semantics.
    notes: []
  - identifier: contactInfo
    name: Contact Information
    cardinality: 1-2
    mutability: read-write
    data_type: External:RPP-JSContact-Profile:Card
    description: Contains contact information.
    constraints: []
    notes: []
  - identifier: authInfo
    name: Authorisation Information
    cardinality: 0-1
    mutability: read-write
    data_type: Authorisation Information
    description: Authorisation information associated with the contact object.
    constraints: []
    notes: []
  - identifier: disclose
    name: Disclose
    cardinality: 0-1
    mutability: read-write
    data_type: Disclose Object.
    description: Identifies elements that require exceptional server-operator handling to allow or restrict
      disclosure to third parties.
    constraints: []
    notes: []
  - identifier: processes
    name: Processes
    cardinality: 0-1
    mutability: read-only
    data_type: Processes Object
    description: The Process Objects currently or recently initiated on the contact object.
    constraints: []
    notes: []
  operations:
  - identifier: create
    name: Create Operation
    description: The Create operation allows a client to provision a new Contact resource. The operation
      accepts as input all create-only and read-write data elements defined for the Contact Data Object.
    authorisation:
    - Generally each client is authorised to create new contact objects becoming a sponsoring client.
      This can be however constrained by the server policy, e.g. by applying rate limiting or compliance
      locks.
    input: ''
    output: ''
    notes:
    - 'In EPP Compatibility Profile, the following data elements MUST be provided:'
    params: []
  - identifier: read
    name: Read Operation
    description: The Read operation allows a client to retrieve the data elements of a Contact resource.
      The server's response MAY vary depending on client authorisation and server policy.
    authorisation:
    - 'Sponsoring client:

      * Full object'
    - 'Other client:

      * Without Object Authorisation:

      * Limited object (non-confidential properties) or operation denied

      * With Object Authorisation:

      * Full object, however some properties only authorised to the sponsoring client MAY be redacted
      according to server policy'
    input: ''
    output: ''
    notes:
    - Authorisation Information (`authInfo`) MUST NOT be provided in the response if the querying client
      is not the current sponsoring client.
    - When constructing the response, the server MUST respect the disclosure policies defined by the Disclose
      Object (`disclose`), whether set by the server operator's default data-collection policy or by the
      sponsoring client for the contact. Data elements marked for non-disclosure MUST NOT be included
      in responses to unauthorised clients.
    params: []
  - identifier: update
    name: Update Operation
    description: The Update operation allows a client to modify the attributes of an existing Contact
      resource.
    authorisation:
    - Only sponsoring client is authorised to perform this operation
    input: ''
    output: ''
    notes:
    - 'The following aspects of the contact object MAY be modified:'
    - A client MUST NOT add, delete or alter values for statuses managed by the server (prefixed with
      "server"). A server MAY add, delete or alter status values set by a client, subject to server policy.
    params: []
  - identifier: delete
    name: Delete Operation
    description: The Delete operation allows a client to remove an existing Contact resource. The operation
      targets a specific data object identified by its Handle ID.
    authorisation:
    - Only sponsoring client is authorised to perform this operation
    input: ''
    output: ''
    notes:
    - The server SHOULD reject a delete request if the contact object is associated with other known objects
      (e.g., domain names). An associated contact SHOULD NOT be deleted until associations with other
      known objects have been broken.
    - The error response SHOULD indicate the existing object associations.
    params: []
  subsections: []
- identifier: host
  name: Host Data Object
  object_type: Resource
  description: ''
  preamble:
  - The following data elements are defined for the Host Data Object.
  elements:
  - identifier: hostName
    name: Host Name
    cardinality: '1'
    mutability: read-write
    data_type: String
    description: Fully qualified name of a host.
    constraints:
    - The value MUST be a syntactically valid host name.
    notes: []
  - identifier: provMetadata
    name: Provisioning Metadata
    cardinality: '1'
    mutability: read-only
    data_type: Provisioning Metadata Object
    description: Standard metadata about the object's lifecycle and ownership.
    constraints: []
    notes: []
  - identifier: status
    name: Status
    cardinality: 0+
    mutability: read-only
    data_type: Status Object
    description: The current status descriptors associated with the host.
    constraints:
    - Possible combinations of Host Status Labels are specified in [@!RFC5732, section 2.3]
    notes: []
  - identifier: dns
    name: DNS Data
    cardinality: 0-1
    mutability: read-write
    data_type: DNS Data Object
    description: DNS resource records and operational controls related to the host. This structure follows
      the unified DNS data model defined in [@I-D.simmen-rpp-dns-data].
    constraints:
    - The names of DNS entries MUST be the host name itself or subordinate to the host name.
    - In EPP Compatibility Profile the record entries MUST be limited to A and AAAA entries for IPv4 and
      IPv6 glue records respectively.
    notes: []
  - identifier: processes
    name: Processes
    cardinality: 0-1
    mutability: read-only
    data_type: Processes Object
    description: The Process Objects currently or recently initiated on the host object.
    constraints: []
    notes: []
  operations:
  - identifier: create
    name: Create Operation
    description: The Create operation allows a client to provision a new Host Data Object. The operation
      accepts as input all create-only and read-write data elements defined for the Host Data Object.
    authorisation:
    - Generally each client is authorised to create new host objects becoming a sponsoring client. This
      can be however constrained by the server policy, e.g. by applying rate limiting or compliance locks.
    input: ''
    output: ''
    notes:
    - If the host name exists in a namespace for which the server is authoritative, then the superordinate
      domain of the host MUST be known to the server before the host object can be created.
    - In EPP Compatibility Profile, IP addresses are REQUIRED only as needed to produce DNS glue records.
      If the host name exists in a namespace for which the server is authoritative and is subordinate
      to an existing domain, IP addresses SHOULD be provided. If the host name is external to the server's
      namespace, IP addresses are not required by the DNS and MAY be omitted.
    params: []
  - identifier: read
    name: Read Operation
    description: The Read operation allows a client to retrieve the data elements of a Host Data Object.
    authorisation:
    - Any client is authorised to retrieve the full object. In EPP Compatibility Profile, host objects
      do not carry authorisation information and there is no distinction based on client identity as described
      in [@!RFC5732, section 3.1.2].
    input: ''
    output: ''
    notes: []
    params: []
  - identifier: update
    name: Update Operation
    description: The Update operation allows a client to modify the attributes of an existing Host Data
      Object. The operation targets a specific data object identified by its host name.
    authorisation:
    - Only sponsoring client is authorised to perform this operation
    input: ''
    output: ''
    notes:
    - Host name changes MAY require the addition or removal of IP addresses to be accepted by the server.
      IP address association MAY be subject to server policies for provisioning hosts as name servers.
    - 'Host name changes can have an impact on associated objects that refer to the host object. A Host
      Name change SHOULD NOT require additional updates of associated objects to preserve existing associations,
      with one exception: changing an external host object that has associations with objects that are
      sponsored by a different client. Attempts to update such hosts directly MUST fail. The change can
      be provisioned by creating a new external host with a new name and any needed new attributes, and
      subsequently updating the other objects sponsored by the client.'
    params: []
  - identifier: delete
    name: Delete Operation
    description: The Delete operation allows a client to remove an existing Host Data Object. The operation
      targets a specific data object identified by its host name.
    authorisation:
    - Only sponsoring client is authorised to perform this operation
    input: ''
    output: ''
    notes:
    - The server SHOULD reject a delete request if the host object is associated with any other object,
      such as a domain name object. Deleting a host object without first breaking existing associations
      can cause DNS resolution failure for domain objects that refer to the deleted host object.
    - The error response SHOULD indicate the related associated objects.
    params: []
  subsections: []
- identifier: organisation
  name: Organisation Data Object
  object_type: Resource
  description: ''
  preamble:
  - The following data elements are defined for the Organisation Data Object.
  elements:
  - identifier: id
    name: Organisation ID
    cardinality: '1'
    mutability: create-only
    data_type: Identifier
    description: A server-unique identifier for the organisation object.
    constraints:
    - This value MUST be supported to be provided by the client.
    - Servers MAY support server-side generation of this value.
    notes: []
  - identifier: provMetadata
    name: Provisioning Metadata
    cardinality: '1'
    mutability: read-only
    data_type: Provisioning Metadata Object
    description: Standard metadata about the object's lifecycle and ownership.
    constraints: []
    notes: []
  - identifier: status
    name: Status
    cardinality: 1+
    mutability: read-write
    data_type: Status Object
    description: The current operational status descriptors associated with the organisation. An organisation
      object MUST always have at least one associated status value.
    constraints:
    - Status values that can be added or removed by a client are prefixed with "client". Corresponding
      server-managed status values are prefixed with "server".
    - 'Possible values: `ok`, `hold`, `terminated`, `linked`, `clientLinkProhibited`, `serverLinkProhibited`,
      `clientUpdateProhibited`, `serverUpdateProhibited`, `clientDeleteProhibited`, `serverDeleteProhibited`,
      `pendingCreate`, `pendingUpdate`, `pendingDelete`.'
    - '`pendingCreate`, `ok`, `hold`, and `terminated` are mutually exclusive.'
    - '`ok` MAY only be combined with `linked`.'
    notes: []
  - identifier: roles
    name: Roles
    cardinality: 1+
    mutability: read-write
    data_type: DictionaryComposition[Organisation Role Object]
    description: One or more roles describing the relationship the organisation has within the registry
      ecosystem. An organisation object MUST always have at least one associated role.
    constraints:
    - An organisation MAY have multiple roles with different role types.
    - Role types are registered in the IANA "EPP Organisation Role Values" registry as defined in [@!RFC8543,
      section 7.3]. Initial values include `registrar`, `reseller`, `privacyproxy`, and `dns-operator`.
    notes: []
  - identifier: parent
    name: Parent Organisation ID
    cardinality: 0-1
    mutability: read-write
    data_type: Organisation Data Object
    description: The parent organisation in a hierarchical organisation structure (e.g., a reseller's
      parent registrar).
    constraints:
    - Loops MUST be prohibited. If organisation A has organisation B as its parent, organisation B MUST
      NOT have organisation A as its parent, directly or transitively.
    notes: []
  - identifier: contactInfo
    name: Contact Information
    cardinality: 0-1
    mutability: read-write
    data_type: External:RPP-JSContact-Profile:Card
    description: Contact information for the organisation.
    constraints: []
    notes: []
  - identifier: contacts
    name: Contacts
    cardinality: 0+
    mutability: read-write
    data_type: LabelledAggregation[Contact Object]
    description: Identifiers of contact objects associated with the organisation.
    constraints:
    - Contact object identifiers MUST be known to the server before the contact can be associated.
    notes: []
  - identifier: users
    name: Users
    cardinality: 0+
    mutability: read-write
    data_type: LabelledAggregation[User Object]
    description: One or more RBAC roles assigned to the user.
    constraints:
    - Each role value MUST be a non-empty string.
    - Allowed role values MAY be constrained by server policy.
    notes: []
  - identifier: processes
    name: Processes
    cardinality: 0-1
    mutability: read-only
    data_type: Processes Object
    description: The Process Objects currently or recently initiated on the organisation object.
    constraints: []
    notes: []
  operations:
  - identifier: create
    name: Create Operation
    description: The Create operation allows a client to provision a new Organisation Data Object. The
      operation accepts as input all create-only and read-write data elements defined for the Organisation
      Data Object.
    authorisation:
    - Generally only registry clients are authorised to create new organisation objects.
    input: ''
    output: ''
    notes:
    - An organisation object MUST include at least one role on creation. The server MAY defer completing
      the action and return a `pendingCreate` status if human or third-party review is required.
    params: []
  - identifier: read
    name: Read Operation
    description: The Read operation allows a client to retrieve the data elements of an Organisation Data
      Object.
    authorisation:
    - Any client is authorised to retrieve organisation object information. The server MAY restrict the
      information returned based on client identity and server policy.
    input: ''
    output: ''
    notes: []
    params: []
  - identifier: update
    name: Update Operation
    description: The Update operation allows a client to modify the attributes of an existing Organisation
      Data Object.
    authorisation:
    - Generally only registry clients are authorised to update organisation objects.
    input: ''
    output: ''
    notes:
    - 'The following aspects of the organisation object MAY be modified:'
    - A client MUST NOT add, delete, or alter values for statuses managed by the server (prefixed with
      "server"). A server MAY add, delete, or alter status values set by a client, subject to server policy.
    params: []
  - identifier: delete
    name: Delete Operation
    description: The Delete operation allows a client to remove an existing Organisation Data Object.
      The operation targets a specific data object identified by its Organisation ID.
    authorisation:
    - Generally only registry clients are authorised to delete organisation objects.
    input: ''
    output: ''
    notes:
    - An organisation object MUST NOT be deleted if it is associated with other known objects (e.g., domain
      names, contacts, or child organisations). The server MUST reject such a delete request and notify
      the client that object relationships exist.
    - The error response SHOULD indicate the related associated objects.
    params: []
  subsections: []
- identifier: user
  name: User Data Object
  object_type: Resource
  description: ''
  preamble:
  - The following data elements are defined for the User Data Object.
  elements:
  - identifier: id
    name: User Identifier
    cardinality: '1'
    mutability: create-only
    data_type: Identifier
    description: A unique identifier for the user
    constraints:
    - MUST be globally unique in the server scope
    notes: []
  - identifier: details
    name: Details
    cardinality: '1'
    mutability: read-write
    data_type: External:RPP-JSContact-Profile:Card
    description: The details of the user, such as name, email, and phone number
    constraints:
    - '-'
    notes: []
  - identifier: description
    name: Description
    cardinality: 0-1
    mutability: read-write
    data_type: String
    description: A description of the user
    constraints:
    - '-'
    notes: []
  - identifier: status
    name: Status
    cardinality: '1'
    mutability: read-write
    data_type: String
    description: The status of the user
    constraints:
    - '-'
    notes: []
  - identifier: organisationId
    name: Organisation ID
    cardinality: '1'
    mutability: read-only
    data_type: Organisation Data Object Reference
    description: A reference to the owner organisation object.
    constraints:
    - '-'
    notes: []
  - identifier: processes
    name: Processes
    cardinality: 0-1
    mutability: read-only
    data_type: Processes Object
    description: The Process Objects currently or recently initiated on the user object.
    constraints: []
    notes: []
  operations:
  - identifier: create
    name: Create Operation
    description: The Create operation creates a new user, which is associated with an existing Organisation
      Object. The operation accepts as input all create-only and read-write data elements of the User
      Object.
    authorisation:
    - Client can only create users in the context of the organisation linked to the client, and only if
      the client has the necessary permissions to create users in that organisation.
    input: ''
    output: ''
    notes: []
    params: []
  - identifier: read
    name: Read Operation
    description: The Read operation retrieves the data of a specific User Object.
    authorisation:
    - Client can only read users in the context of the organisation linked to the client, and only if
      the client has the necessary permissions to read users in that organisation.
    input: ''
    output: ''
    notes: []
    params: []
  - identifier: update
    name: Update Operation
    description: The Update operation modifies the read-write data elements.
    authorisation:
    - Client can only update users in the context of the organisation linked to the client, and only if
      the client has the necessary permissions to update users in that organisation.
    input: ''
    output: ''
    notes: []
    params: []
  - identifier: delete
    name: Delete Operation
    description: The Delete operation removes a specific User Object.
    authorisation:
    - Client can only delete users in the context of the organisation linked to the client, and only if
      the client has the necessary permissions to delete users in that organisation.
    input: ''
    output: ''
    notes:
    - The server MUST reject this operation if the User is associated with an Organisation Object.
    params: []
  subsections: []
